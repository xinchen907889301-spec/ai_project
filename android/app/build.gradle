plugins { id 'com.android.application' }
android {
    namespace 'cn.yiyou.assistant'
    compileSdk 35
    defaultConfig { applicationId 'cn.yiyou.assistant'; minSdk 29; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug {
        def cloudKey = file("${rootDir}/../.local/debug.keystore")
        if (cloudKey.exists()) storeFile cloudKey
    } }
    sourceSets.main.assets.srcDirs = ['../../app/public']
}
